name: "release"

on:
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
    steps:
      - name: Check out project
        uses: actions/checkout@v5
        with:
          repository: doroved/proxer
          token: ${{ secrets.GH_TOKEN_FOR_CHECKOUT }}

      - name: Get version
        id: get-version
        run: |
          VERSION=$(grep -m 1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or get draft release
        id: create-release
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `v${{ steps.get-version.outputs.version }}`;
            const owner = 'doroved';
            const repo = 'proxer-releases';

            // Check if draft release with this tag already exists
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            });

            const existingDraft = releases.find(r => r.tag_name === tag && r.draft);
            if (existingDraft) {
              console.log(`Found existing draft release: ${existingDraft.id}`);
              core.setOutput('release_id', existingDraft.id);
              return;
            }

            const body = '[Download Proxer](https://github.com/doroved/proxer-releases/releases/download/installer/Proxer.dmg)\n\nSee the assets to download this version and install, or go to https://proxer.app to download.';

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              body: body,
              draft: true,
              prerelease: false,
              target_commitish: 'main'
            });

            console.log(`Created new draft release: ${release.data.id}`);
            core.setOutput('release_id', release.data.id);

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: macos-latest
          - platform: macos-14
            args: "--target aarch64-apple-darwin"
            name: macOS Apple
          # - platform: macos-latest
          - platform: macos-14
            args: "--target x86_64-apple-darwin"
            name: macOS Intel
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out project
        uses: actions/checkout@v5
        with:
          repository: doroved/proxer
          token: ${{ secrets.GH_TOKEN_FOR_CHECKOUT }}

      - name: Create temporary certificate files
        run: |
          mkdir -p ./src-tauri/assets/certs
          echo "${{ secrets.CLIENT_CERT_PEM }}" > ./src-tauri/assets/certs/client.pem
          echo "${{ secrets.CLIENT_KEY_PEM }}" > ./src-tauri/assets/certs/client-key.pem

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.args }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{secrets.APPLE_CERTIFICATE}}
          APPLE_CERTIFICATE_PASSWORD: ${{secrets.APPLE_CERTIFICATE_PASSWORD}}
          APPLE_ID: ${{secrets.APPLE_ID}}
          APPLE_PASSWORD: ${{secrets.APPLE_PASSWORD}}
          APPLE_TEAM_ID: ${{secrets.APPLE_TEAM_ID}}
          TAURI_SIGNING_PRIVATE_KEY: ${{secrets.TAURI_SIGNING_PRIVATE_KEY}}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD}}
          CI: false
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: "[Download Proxer](https://github.com/doroved/proxer-releases/releases/download/installer/Proxer.dmg)\n\nSee the assets to download this version and install, or go to https://proxer.app to download."
          args: ${{ matrix.args }}
          repo: proxer-releases
          owner: doroved

      - name: Remove temporary certificate files
        if: always()
        run: rm -rf ./src-tauri/assets/certs
